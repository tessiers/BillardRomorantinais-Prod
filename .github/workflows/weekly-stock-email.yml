name: Weekly Stock Email

on:
  schedule:
    # 18:00 UTC correspond à 19:00 ou 20:00 en France. (Tous les dimanches = 0)
    - cron: '0 18 * * 0'
  workflow_dispatch: # Permet de le lancer manuellement depuis l'interface GitHub

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run script
        run: node scripts/sendWeeklyStockEmail.js
